name: Nightly Build (all.sh)

on:
  schedule:
    - cron: "0 21 * * *"  # Ejecuta a las 21:00 UTC cada noche
  workflow_dispatch:        # Permite ejecución manual

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/build-results

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "📦 Instalando dependencias necesarias..."
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            abootimg \
            android-sdk-libsparse-utils \
            mkbootimg

      - name: Verify installed tools
        run: |
          echo "🔧 Verificando herramientas..."
          which losetup || echo "⚠️ losetup no encontrado"
          which abootimg || echo "⚠️ abootimg no encontrado"
          which mkbootimg || echo "⚠️ mkbootimg no encontrado"
          which simg2img || echo "⚠️ simg2img no encontrado"
          which img2simg || echo "⚠️ img2simg no encontrado"

      - name: Prepare build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Run build script (builds PHOSH and PLAMO)
        run: |
          echo "🚀 Ejecutando all.sh con privilegios de administrador..."
          sudo bash all.sh
        shell: bash

      - name: Set date format (YYYY.MM.DD)
        id: date
        run: echo "DATE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Package generated files
        run: |
          ZIP_FILE="${{ env.BUILD_DIR }}/openSUSE-Tumbleweed-ARM_${{ env.DATE_TAG }}-nightly.zip"
          echo "📦 Empaquetando archivos en: $ZIP_FILE"
          shopt -s nullglob
          FILES=(openSUSE*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ No se encontraron archivos que comiencen por 'openSUSE'"
            exit 1
          fi
          zip -r "$ZIP_FILE" "${FILES[@]}"
        shell: bash

      - name: Delete previous nightly release if exists
        run: |
          gh release delete nightly-v${{ env.DATE_TAG }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new nightly release
        run: |
          gh release create nightly-v${{ env.DATE_TAG }} \
            "${{ env.BUILD_DIR }}/openSUSE-Tumbleweed-ARM_${{ env.DATE_TAG }}-nightly.zip" \
            --title "Nightly Build - ${{ env.DATE_TAG }}" \
            --notes "Automated nightly PHOSH & PLAMO build for Oneplus 6/6t (enchilada & fajita) on ${{ env.DATE_TAG }}" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        run: sudo rm -rf ${{ env.BUILD_DIR }}
